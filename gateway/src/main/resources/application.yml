server:
  port: 8080

spring:
  application:
    name: gpt-gateway
  config:
    # 从 Nacos 加载远程路由配置。
    # optional 可避免 Nacos 未就绪时网关启动失败。
    import:
      - optional:nacos:gateway-routes.yaml?group=GATEWAY_GROUP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      discovery:
        enabled: true
        namespace: modelGateway
      config:
        enabled: true
        namespace: modelGateway
        file-extension: yaml
    gateway:
      discovery:
        locator:
          # 自动路由模式：/{service-id}/** -> lb://{service-id}
          enabled: true
          lower-case-service-id: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-no-trace}] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

gateway:
  dynamic-route:
    enabled: true
    data-id: gateway-routes.yaml
    group: GATEWAY_GROUP
    timeout-ms: 3000
  filters:
    logging:
      enabled: true
      log-request-body: true
      log-response-body: true
      max-body-log-size: 2048
    rate-limit:
      enabled: true
      # 每个客户端 IP 每秒补充的令牌数。
      replenish-rate: 50
      # 每个客户端 IP 允许的瞬时突发请求数。
      burst-capacity: 100
      cleanup-interval: 10m
